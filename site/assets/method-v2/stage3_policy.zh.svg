<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1370" viewBox="0 0 1500 1370" role="img" aria-labelledby="stage3-title stage3-desc" xml:lang="zh-Hans">
<title id="stage3-title">阶段三 · 先验引导的VLA后训练</title>
<desc id="stage3-desc">当前机器人图像进入两条独立视觉支路。冻结P及其独立冻结视觉编码器生成联合码向量期望，形成三个尺度、每尺度六维的连续潜动作先验。显式截断梯度后，先验进入约532K参数的残差适配器，只有其输出层零初始化。2048维残差在Actor的1152到2048视觉投影之后、VLM Transformer之前，广播相加到有效视觉token。本体状态与任务提示沿原生π0.5条件路径进入前缀，不进入P，也不被适配器直接修改。条件化前缀通过注意力或KV缓存作用于动作expert，再经流采样生成原生动作。训练时预测速度、原生动作目标、带噪动作与时刻共同定义流匹配；更新适配器和指定Actor参数，P保持冻结。</desc>
<defs>
<marker id="stage3-arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#517D61"/></marker>
<marker id="stage3-arrow-prior" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#795A9B"/></marker>
<marker id="stage3-arrow-supervision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#AF7437"/></marker>
</defs>
<style>text{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#17324D;}path,rect,circle{vector-effect:non-scaling-stroke;}</style>
<rect id="stage3-background" width="100%" height="100%" fill="#FFFFFF"/>
<text x="60" y="62" font-size="29" font-weight="650">阶段三 · 先验引导的VLA后训练</text>
<text x="60" y="100" font-size="18" fill="#536879">冻结P与Actor使用独立视觉支路，以机器人原生动作的流匹配目标后训练策略。</text>
