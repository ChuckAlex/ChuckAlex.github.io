<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1370" viewBox="0 0 1500 1370" role="img" aria-labelledby="stage3-title stage3-desc" xml:lang="en">
<title id="stage3-title">Stage 3 · Prior-Guided VLA Post-Training</title>
<desc id="stage3-desc">Current robot views enter two independent visual paths. Frozen P and its independent frozen vision produce a joint-code expectation and a continuous three-scale six-dimensional prior. Stop Gradient detaches this prior before the approximately 532K residual adapter, whose output layer alone is zero initialized. The adapter residual is broadcast-added to valid 2048-dimensional projected Actor visual tokens after the 1152-to-2048 projection and before the VLM transformer. Proprioception and a task prompt follow the native pi-zero-point-five prefix path, not P or direct adapter modification. The conditioned prefix supplies attention or a KV cache to the Action Expert, which produces native actions through flow sampling. During training, predicted velocity and native-action targets define flow matching with noisy actions and time. Only the adapter and eligible Actor parameters update; P remains frozen.</desc>
<defs>
<marker id="stage3-arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#517D61"/></marker>
<marker id="stage3-arrow-prior" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#795A9B"/></marker>
<marker id="stage3-arrow-supervision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#AF7437"/></marker>
</defs>
<style>text{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#17324D;}path,rect,circle{vector-effect:non-scaling-stroke;}</style>
