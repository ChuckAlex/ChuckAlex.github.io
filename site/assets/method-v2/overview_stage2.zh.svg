<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh" role="img" aria-labelledby="svg-title svg-desc" viewBox="0 0 1280 600" width="1280" height="600">
<title id="svg-title">阶段 2 · 仅凭当前图像预测</title>
<desc id="svg-desc">当前观测预测器 P. Five primary modules. Primary model flow, independent visual bypasses, and subordinate training supervision are distinguished.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#5d6c82"/></marker><marker id="sup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b78c52"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="40" y="48" text-anchor="start" font-size="26" font-weight="600" fill="#26374d" >阶段 2 · 仅凭当前图像预测</text>
<text x="40" y="84" text-anchor="start" font-size="18" font-weight="400" fill="#647287" >当前观测预测器 P</text>
<path id="s2-e-current-p" data-from="s2-current" data-to="s2-predictor" data-source="s2-current" data-target="s2-predictor" data-kind="flow" d="M 230 245 L 275 245" fill="none" stroke="#5d6c82" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="s2-e-p-joint" data-from="s2-predictor" data-to="s2-joint" data-source="s2-predictor" data-target="s2-joint" data-kind="flow" d="M 485 245 L 530 245" fill="none" stroke="#5d6c82" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="s2-e-joint-expectation" data-from="s2-joint" data-to="s2-expectation" data-source="s2-joint" data-target="s2-expectation" data-kind="flow" d="M 740 245 L 785 245" fill="none" stroke="#5d6c82" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="s2-e-expectation-prior" data-from="s2-expectation" data-to="s2-prior" data-source="s2-expectation" data-target="s2-prior" data-kind="flow" d="M 995 245 L 1040 245" fill="none" stroke="#5d6c82" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="s2-e-labels-nll" data-from="s2-labels" data-to="s2-nll" data-source="s2-labels" data-target="s2-nll" data-kind="supervision" data-source-port="discrete_ids" d="M 570 465 L 660 465" fill="none" stroke="#b78c52" stroke-width="2" stroke-linejoin="round" marker-end="url(#sup-arrow)"/>
<path id="s2-e-probabilities-nll" data-from="s2-predictor" data-to="s2-nll" data-source="s2-predictor" data-target="s2-nll" data-kind="supervision" data-source-port="slot_probabilities" d="M 380 310 L 380 365 L 810 365 L 810 430" fill="none" stroke="#b78c52" stroke-width="2" stroke-linejoin="round" marker-end="url(#sup-arrow)"/>
<g id="s2-current" data-node-id="s2-current" data-primary="true" data-kind="input"><rect x="40" y="180" width="190" height="130" rx="9" fill="#f2f5f8" stroke="#8b9eb4" stroke-width="1.5"/>
<text x="135" y="238" text-anchor="middle" font-size="20" font-weight="600" fill="#26374d" >当前图像</text>
<text x="135" y="263" text-anchor="middle" font-size="18" font-weight="400" fill="#26374d" >冻结视觉特征</text>
</g>
<g id="s2-predictor" data-node-id="s2-predictor" data-primary="true" data-kind="model"><rect x="275" y="180" width="210" height="130" rx="9" fill="#f8f9fc" stroke="#788daa" stroke-width="1.5"/>
<text x="380" y="238" text-anchor="middle" font-size="20" font-weight="600" fill="#26374d" >双码槽预测器 P</text>
<text x="380" y="263" text-anchor="middle" font-size="18" font-weight="400" fill="#26374d" >码槽自回归</text>
</g>
<g id="s2-joint" data-node-id="s2-joint" data-primary="true" data-kind="latent"><rect x="530" y="180" width="210" height="130" rx="9" fill="#f3f0f8" stroke="#9a8aad" stroke-width="1.5"/>
<text x="635" y="238" text-anchor="middle" font-size="20" font-weight="600" fill="#26374d" >编码联合分布</text>
<text x="635" y="263" text-anchor="middle" font-size="18" font-weight="400" fill="#26374d" >双码槽概率</text>
</g>
<g id="s2-expectation" data-node-id="s2-expectation" data-primary="true" data-kind="latent"><rect x="785" y="180" width="210" height="130" rx="9" fill="#f3f0f8" stroke="#9a8aad" stroke-width="1.5"/>
<text x="890" y="238" text-anchor="middle" font-size="20" font-weight="600" fill="#26374d" >码向量期望</text>
<text x="890" y="263" text-anchor="middle" font-size="18" font-weight="400" fill="#26374d" >固定 FSQ 数值向量</text>
</g>
<g id="s2-prior" data-node-id="s2-prior" data-primary="true" data-kind="prior"><rect x="1040" y="180" width="200" height="130" rx="9" fill="#eeedf7" stroke="#87769e" stroke-width="1.5"/>
<text x="1140" y="238" text-anchor="middle" font-size="20" font-weight="600" fill="#26374d" >连续潜动作先验</text>
<text x="1140" y="263" text-anchor="middle" font-size="18" font-weight="400" fill="#26374d" >3 × 6D</text>
</g>
<g id="s2-labels" data-node-id="s2-labels" data-primary="false" data-kind="supervision"><rect x="300" y="430" width="270" height="70" rx="6" fill="#fff8ee" stroke="#cfaa73" stroke-width="1.5"/>
<text x="435" y="462" text-anchor="middle" font-size="16" font-weight="600" fill="#26374d" >Teacher 导出的离散标签</text>
<text x="435" y="483" text-anchor="middle" font-size="16" font-weight="400" fill="#26374d" >冻结 Teacher</text>
</g>
<g id="s2-nll" data-node-id="s2-nll" data-primary="false" data-kind="supervision"><rect x="660" y="430" width="300" height="70" rx="6" fill="#fff8ee" stroke="#cfaa73" stroke-width="1.5"/>
<text x="810" y="462" text-anchor="middle" font-size="16" font-weight="600" fill="#26374d" >双码槽 NLL</text>
<text x="810" y="483" text-anchor="middle" font-size="16" font-weight="400" fill="#26374d" >训练预测器 P</text>
</g>
<text x="610" y="348" text-anchor="middle" font-size="16" font-weight="400" fill="#53647a" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">P 的码槽概率</text>
<text x="40" y="550" text-anchor="start" font-size="16" font-weight="400" fill="#5f6d80" >自回归发生在两个码槽之间，而非机器人时间轴。</text>
</g>
</svg>
