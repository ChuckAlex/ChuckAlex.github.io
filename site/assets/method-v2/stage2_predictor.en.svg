</g>
<g id="s2-predictor" data-node-id="s2-predictor" data-node-type="predictor" aria-label="Current-Observation. Predictor (P). Two-slot autoregressive. prediction: k₁ then k₂"><rect x="340" y="245" width="260" height="130" rx="8" fill="#F2EFF8" stroke="#79659B" stroke-width="1.5"/>
<text id="s2-predictor-title-0" class="node-title" x="470" y="282.5" text-anchor="middle">Current-Observation</text>
<text id="s2-predictor-title-1" class="node-title" x="470" y="304.5" text-anchor="middle">Predictor (P)</text>
<text id="s2-predictor-body-0" class="node-body" x="470" y="331.5" text-anchor="middle">Two-slot autoregressive</text>
<text id="s2-predictor-body-1" class="node-body" x="470" y="351.5" text-anchor="middle">prediction: k₁ then k₂</text>
</g>
<g id="s2-joint-distribution" data-node-id="s2-joint-distribution" data-node-type="predictor" aria-label="Joint Code Distribution. p(k₁ | Iₜ, h) ×. p(k₂ | k₁, Iₜ, h)"><rect x="670" y="245" width="280" height="130" rx="8" fill="#F2EFF8" stroke="#79659B" stroke-width="1.5"/>
<text id="s2-joint-distribution-title-0" class="node-title" x="810" y="293.5" text-anchor="middle">Joint Code Distribution</text>
<text id="s2-joint-distribution-body-0" class="node-body" x="810" y="320.5" text-anchor="middle">p(k₁ | Iₜ, h) ×</text>
<text id="s2-joint-distribution-body-1" class="node-body" x="810" y="340.5" text-anchor="middle">p(k₂ | k₁, Iₜ, h)</text>
</g>
<g id="s2-code-expectation" data-node-id="s2-code-expectation" data-node-type="code" aria-label="Expected Code Vectors. Joint-probability weighting. of fixed FSQ numeric vectors"><rect x="1020" y="245" width="340" height="130" rx="8" fill="#F4F1F8" stroke="#8B78A5" stroke-width="1.5"/>
<text id="s2-code-expectation-title-0" class="node-title" x="1190" y="293.5" text-anchor="middle">Expected Code Vectors</text>
<text id="s2-code-expectation-body-0" class="node-body" x="1190" y="320.5" text-anchor="middle">Joint-probability weighting</text>
<text id="s2-code-expectation-body-1" class="node-body" x="1190" y="340.5" text-anchor="middle">of fixed FSQ numeric vectors</text>
</g>
<g id="s2-continuous-prior" data-node-id="s2-continuous-prior" data-node-type="output" aria-label="Continuous Latent-Action. Prior. 3 scales × 6D · to robot policy"><rect x="1020" y="505" width="340" height="110" rx="8" fill="#F5F4F9" stroke="#8B78A5" stroke-width="1.5"/>
<text id="s2-continuous-prior-title-0" class="node-title" x="1190" y="542.5" text-anchor="middle">Continuous Latent-Action</text>
<text id="s2-continuous-prior-title-1" class="node-title" x="1190" y="564.5" text-anchor="middle">Prior</text>
<text id="s2-continuous-prior-body-0" class="node-body" x="1190" y="591.5" text-anchor="middle">3 scales × 6D · to robot policy</text>
</g>
<g id="s2-frozen-teacher" data-node-id="s2-frozen-teacher" data-node-type="input" aria-label="Frozen Trained. Teacher. Offline label generation"><rect x="40" y="525" width="230" height="100" rx="8" fill="#F5F7FA" stroke="#AAB8C9" stroke-width="1.5"/>
<text id="s2-frozen-teacher-title-0" class="node-title" x="155" y="557.5" text-anchor="middle">Frozen Trained</text>
