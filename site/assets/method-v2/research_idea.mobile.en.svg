<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1090" viewBox="0 0 420 1090" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Research Idea · Mobile</title>
<desc id="desc">UMI transfers knowledge; Ego remains a separate, unconnected future-integration node.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#153d66"/></marker><marker id="supervision" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#b77729"/></marker></defs>
<rect width="420" height="1090" fill="white"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">
<text id="heading" x="210" y="38" text-anchor="middle" font-size="23" font-weight="650" fill="#192533">Research Idea</text>
<text id="goal" x="210" y="69" text-anchor="middle" font-size="16" font-weight="400" fill="#536173">Long-Term Research Goal: Ego + UMI + Robot</text>
<rect x="20" y="90" width="380" height="275" rx="8" fill="white" stroke="#dce3eb"/>
<text id="human-title" x="210" y="122" text-anchor="middle" font-size="18" font-weight="600" fill="#192533">Low-Cost Human Demonstrations</text>
<text id="human-subtitle" x="210" y="148" text-anchor="middle" font-size="16" font-weight="400" fill="#536173">(Ego + UMI)</text>
<polyline id="idea-umi-knowledge" data-from="umi" data-to="knowledge" points="120,265 120,386 210,386 210,410" fill="none" stroke="#153d66" stroke-width="2" marker-end="url(#arrow)"/>
<polyline id="idea-knowledge-vla" data-from="knowledge" data-to="vla" points="390,453 405,453 405,742 390,742" fill="none" stroke="#153d66" stroke-width="2" marker-end="url(#arrow)"/>
<polyline id="idea-vla-policy" data-from="vla" data-to="policy" points="210,785 210,860" fill="none" stroke="#153d66" stroke-width="2" marker-end="url(#arrow)"/>
<polyline id="idea-robot-vla" data-from="robot" data-to="vla" points="210,615 210,700" fill="none" stroke="#b77729" stroke-width="2" marker-end="url(#supervision)"/>
