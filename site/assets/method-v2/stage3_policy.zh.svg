</g>
<text id="e_s3_expert_actions-label" x="1285" y="862" text-anchor="start" font-size="14" fill="#517D61">推理</text>
<text id="e_s3_velocity_loss-label" x="980" y="830" text-anchor="middle" font-size="14" fill="#AF7437">预测速度 vθ(x_t,t)</text>
<text id="e_s3_targets_loss-label" x="465" y="987" text-anchor="middle" font-size="14" fill="#AF7437">原生动作监督</text>
<text id="s3_add_annotation-0" x="720" y="516" font-size="14">仅向有效视觉token广播相加。</text>
