<path id="e_s3_p_expectation" data-source="s3_frozen_p" data-target="s3_joint_expectation" data-from="s3_frozen_p" data-to="s3_joint_expectation" data-kind="prior" d="M680 220 L760 220" stroke="#795A9B" marker-end="url(#stage3-arrow-prior)"/>
