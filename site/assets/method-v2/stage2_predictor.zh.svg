</g>
<g id="s2-frozen-teacher" data-node-id="s2-frozen-teacher" data-node-type="input" aria-label="已训练并冻结的. Teacher. 离线生成标签"><rect x="40" y="525" width="230" height="100" rx="8" fill="#F5F7FA" stroke="#AAB8C9" stroke-width="1.5"/>
<text id="s2-frozen-teacher-title-0" class="node-title" x="155" y="557.5" text-anchor="middle">已训练并冻结的</text>
