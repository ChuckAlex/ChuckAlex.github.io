<text x="1260.0" y="1029.5" text-anchor="middle" font-size="17" font-weight="400">Native joint / gripper targets</text>
</g>
<text id="e_s3_expert_actions-label" x="1285" y="862" text-anchor="start" font-size="14" fill="#517D61">Inference</text>
<text id="e_s3_velocity_loss-label" x="980" y="830" text-anchor="middle" font-size="14" fill="#AF7437">Predicted velocity vθ(x_t,t)</text>
<text id="e_s3_targets_loss-label" x="465" y="987" text-anchor="middle" font-size="14" fill="#AF7437">Native supervision</text>
<text id="s3_add_annotation-0" x="720" y="516" font-size="14">Broadcast-add only to valid visual tokens.</text>
<text id="s3_add_annotation-1" x="720" y="536" font-size="14">No new tokens; no direct text/state changes.</text>
<rect id="stage3-update-panel" x="60" y="1176" width="1340" height="145" rx="13" fill="#F5F7FA" stroke="#D8E1E8"/>
<text id="s3_update_note" x="80" y="1216" font-size="19" font-weight="600">Train Adapter + Eligible Actor Parameters; Freeze P and its independent vision.</text>
<text id="s3_gradient_note" x="80" y="1252" font-size="17" font-weight="400">Frozen Base weights still pass input gradients; Stop Gradient blocks the FM path into P.</text>
<text id="s3_inference_note" x="80" y="1288" font-size="17" font-weight="400">Inference: current views + proprioception + task prompt; no future images or UMI motion labels.</text>
