<text id="ego-label-1" x="300.0" y="230.0" text-anchor="middle" font-size="14" font-weight="400" fill="#536173">Future Integration</text>
<text id="ego-label-2" x="300.0" y="256.0" text-anchor="middle" font-size="14" font-weight="400" fill="#536173">Data Preparation</text>
<text id="ego-label-3" x="300.0" y="282.0" text-anchor="middle" font-size="14" font-weight="400" fill="#536173">Completed; Not Used</text>
<text id="ego-label-4" x="300.0" y="308.0" text-anchor="middle" font-size="14" font-weight="400" fill="#536173">in Current Policy</text>
