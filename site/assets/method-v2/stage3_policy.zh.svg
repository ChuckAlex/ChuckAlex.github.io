<text id="s3_update_note" x="80" y="1216" font-size="19" font-weight="600">更新适配器与指定Actor参数；冻结P及其独立视觉编码器。</text>
<text id="s3_gradient_note" x="80" y="1252" font-size="17" font-weight="400">冻结的Base权重仍允许输入梯度传递；显式截断梯度阻止FM信号进入P。</text>
<text id="s3_inference_note" x="80" y="1288" font-size="17" font-weight="400">推理使用当前图像、本体状态与任务提示；无需未来图像或UMI运动标签。</text>
</svg>
