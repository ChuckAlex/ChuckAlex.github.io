<text id="s2-code-expectation-title-0" class="node-title" x="1190" y="293.5" text-anchor="middle">码向量期望</text>
<text id="s2-code-expectation-body-0" class="node-body" x="1190" y="320.5" text-anchor="middle">按联合概率加权</text>
