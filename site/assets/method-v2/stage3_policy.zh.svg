</g>
<g id="s3_flow_matching" data-node-id="s3_flow_matching" data-node-type="loss">
<title>流匹配损失 / 速度监督目标：ε − a / x_t = tε + (1 − t)a / 训练时将带噪动作x_t与时刻t / 作为原生动作expert的输入。</title>
<rect x="580" y="950" width="430" height="180" rx="13" fill="#FFF2E3" stroke="#AF7437" stroke-width="1.8"/>
