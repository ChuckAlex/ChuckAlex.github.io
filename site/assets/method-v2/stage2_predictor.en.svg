<text id="stage2_predictor-footer-0" class="footer" x="40" y="712">Autoregression is between two code slots, not robot action time steps.</text>
<text id="stage2_predictor-footer-1" class="footer" x="40" y="736">Two-slot NLL trains P; the expectation constructs the policy prior, without a separate prior-regression objective.</text>
<text id="stage2_predictor-footer-2" class="footer" x="40" y="760">P is trained with current UMI views; current Robot views are used for policy conditioning in Stage 3.</text>
