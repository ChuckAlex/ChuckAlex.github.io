<text x="795.0" y="1046.5" text-anchor="middle" font-size="17" font-weight="400">x_t = tε + (1 − t)a</text>
<text x="795.0" y="1069.5" text-anchor="middle" font-size="17" font-weight="400">Training uses noisy actions x_t and t</text>
<text x="795.0" y="1092.5" text-anchor="middle" font-size="17" font-weight="400">for the native Action Expert.</text>
</g>
<g id="s3_native_actions" data-node-id="s3_native_actions" data-node-type="output">
