<text id="stage2_predictor-footer-1" class="footer" x="40" y="736">双槽NLL用于训练P；期望运算构造策略先验，不增加连续先验回归损失。</text>
<text id="stage2_predictor-footer-2" class="footer" x="40" y="760">P训练使用当前UMI图像；阶段三用当前Robot图像生成策略先验。</text>
</svg>
