<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="stage2_predictor-title stage2_predictor-desc" lang="zh-Hans">
<title id="stage2_predictor-title">阶段二 · 当前观测潜动作预测器</title>
<desc id="stage2_predictor-desc">仅凭当前图像学习Teacher离散标签，再通过码向量期望构造连续先验。 自回归发生在两个码槽之间，不沿机器人动作时间轴展开。 双槽NLL用于训练P；期望运算构造策略先验，不增加连续先验回归损失。 P训练使用当前UMI图像；阶段三用当前Robot图像生成策略先验。</desc>
<defs>
<marker id="arrow-data" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth"><polygon points="0,0 10,5 0,10" fill="#345B80"/></marker>
<marker id="arrow-predictor" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth"><polygon points="0,0 10,5 0,10" fill="#70568F"/></marker>
<marker id="arrow-supervision" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth"><polygon points="0,0 10,5 0,10" fill="#A87531"/></marker>
</defs>
<style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1D2A39} .stage-title{font-size:29px;font-weight:600} .stage-subtitle{font-size:17px;fill:#566476} .node-title{font-size:18px;font-weight:600} .node-body{font-size:16px;fill:#455368} .edge-label{font-size:14px;fill:#59677A} .footer{font-size:16px;fill:#455368}</style>
<rect width="1440" height="800" fill="#FFFFFF"/>
<text class="stage-title" x="40" y="58">阶段二 · 当前观测潜动作预测器</text>
<text class="stage-subtitle" x="40" y="96">仅凭当前图像学习Teacher离散标签，再通过码向量期望构造连续先验。</text>
<path id="s2-e01" data-from="s2-current-views" data-to="s2-predictor" data-source="s2-current-views" data-target="s2-predictor" data-edge-kind="predictor" d="M270 310 L340 310" fill="none" stroke="#70568F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-predictor)"/>
