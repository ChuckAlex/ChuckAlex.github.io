<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="stage2_predictor-title stage2_predictor-desc" lang="en">
<title id="stage2_predictor-title">Stage 2 · Current-Observation Latent-Action Predictor</title>
<desc id="stage2_predictor-desc">Learn the Teacher’s discrete labels from current images, then form a continuous prior by expectation. Autoregression is between two code slots, not robot action time steps. Two-slot NLL trains P; the expectation constructs the policy prior, without a separate prior-regression objective. P is trained with current UMI views; current Robot views are used for policy conditioning in Stage 3.</desc>
<defs>
<marker id="arrow-data" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth"><polygon points="0,0 10,5 0,10" fill="#345B80"/></marker>
<marker id="arrow-predictor" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth"><polygon points="0,0 10,5 0,10" fill="#70568F"/></marker>
<marker id="arrow-supervision" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth"><polygon points="0,0 10,5 0,10" fill="#A87531"/></marker>
</defs>
<style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1D2A39} .stage-title{font-size:29px;font-weight:600} .stage-subtitle{font-size:17px;fill:#566476} .node-title{font-size:18px;font-weight:600} .node-body{font-size:16px;fill:#455368} .edge-label{font-size:14px;fill:#59677A} .footer{font-size:16px;fill:#455368}</style>
<rect width="1440" height="800" fill="#FFFFFF"/>
<text class="stage-title" x="40" y="58">Stage 2 · Current-Observation Latent-Action Predictor</text>
<text class="stage-subtitle" x="40" y="96">Learn the Teacher’s discrete labels from current images, then form a continuous prior by expectation.</text>
<path id="s2-e01" data-from="s2-current-views" data-to="s2-predictor" data-source="s2-current-views" data-target="s2-predictor" data-edge-kind="predictor" d="M270 310 L340 310" fill="none" stroke="#70568F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-predictor)"/>
<path id="s2-e02" data-from="s2-predictor" data-to="s2-joint-distribution" data-source="s2-predictor" data-target="s2-joint-distribution" data-edge-kind="predictor" d="M600 310 L670 310" fill="none" stroke="#70568F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-predictor)"/>
<path id="s2-e03" data-from="s2-joint-distribution" data-to="s2-code-expectation" data-source="s2-joint-distribution" data-target="s2-code-expectation" data-edge-kind="predictor" d="M950 310 L1020 310" fill="none" stroke="#70568F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-predictor)"/>
<path id="s2-e04" data-from="s2-code-expectation" data-to="s2-continuous-prior" data-source="s2-code-expectation" data-target="s2-continuous-prior" data-edge-kind="predictor" d="M1190 375 L1190 505" fill="none" stroke="#70568F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-predictor)"/>
<path id="s2-e05" data-from="s2-frozen-teacher" data-to="s2-exported-labels" data-source="s2-frozen-teacher" data-target="s2-exported-labels" data-edge-kind="supervision" d="M270 575 L340 575" fill="none" stroke="#A87531" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-supervision)"/>
<path id="s2-e06" data-from="s2-exported-labels" data-to="s2-two-slot-nll" data-source="s2-exported-labels" data-target="s2-two-slot-nll" data-edge-kind="supervision" d="M600 575 L670 575" fill="none" stroke="#A87531" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-supervision)"/>
<path id="s2-e07" data-from="s2-joint-distribution" data-to="s2-two-slot-nll" data-source="s2-joint-distribution" data-target="s2-two-slot-nll" data-edge-kind="supervision" d="M810 375 L810 525" fill="none" stroke="#A87531" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-supervision)"/>
<g id="s2-horizons" data-annotation-id="s2-horizons"><rect x="40" y="140" width="1320" height="55" rx="7" fill="#F7F9FB" stroke="#D2DAE4" stroke-width="1"/>
<text x="700" y="176" text-anchor="middle" font-size="17" fill="#455368">Query 0.25 s / 0.5 s / 1.0 s with shared P weights</text>
</g>
