<path id="e_s3_expectation_prior" data-source="s3_joint_expectation" data-target="s3_continuous_prior" data-from="s3_joint_expectation" data-to="s3_continuous_prior" data-kind="prior" d="M1040 220 L1120 220" stroke="#795A9B" marker-end="url(#stage3-arrow-prior)"/>
<path id="e_s3_prior_stop" data-source="s3_continuous_prior" data-target="s3_stop_gradient" data-from="s3_continuous_prior" data-to="s3_stop_gradient" data-kind="prior" d="M1260 280 L1260 365" stroke="#795A9B" marker-end="url(#stage3-arrow-prior)"/>
<path id="e_s3_stop_adapter" data-source="s3_stop_gradient" data-target="s3_residual_adapter" data-from="s3_stop_gradient" data-to="s3_residual_adapter" data-kind="prior" d="M1120 415 L1040 415" stroke="#795A9B" marker-end="url(#stage3-arrow-prior)"/>
<path id="e_s3_adapter_add" data-source="s3_residual_adapter" data-target="s3_add_residual" data-from="s3_residual_adapter" data-to="s3_add_residual" data-kind="prior" d="M760 415 L690 415" stroke="#795A9B" marker-end="url(#stage3-arrow-prior)"/>
<path id="e_s3_views_actor" data-source="s3_current_views" data-target="s3_actor_vision" data-from="s3_current_views" data-to="s3_actor_vision" data-kind="flow" d="M185 260 L185 350" stroke="#517D61" marker-end="url(#stage3-arrow-flow)"/>
<path id="e_s3_actor_tokens" data-source="s3_actor_vision" data-target="s3_projected_tokens" data-from="s3_actor_vision" data-to="s3_projected_tokens" data-kind="flow" d="M310 415 L350 415" stroke="#517D61" marker-end="url(#stage3-arrow-flow)"/>
<path id="e_s3_tokens_add" data-source="s3_projected_tokens" data-target="s3_add_residual" data-from="s3_projected_tokens" data-to="s3_add_residual" data-kind="flow" d="M610 415 L630 415" stroke="#517D61" marker-end="url(#stage3-arrow-flow)"/>
<path id="e_s3_add_prefix" data-source="s3_add_residual" data-target="s3_conditioned_prefix" data-from="s3_add_residual" data-to="s3_conditioned_prefix" data-kind="flow" d="M660 445 L660 560 L550 560 L550 650" stroke="#517D61" marker-end="url(#stage3-arrow-flow)"/>
<path id="e_s3_native_prefix" data-source="s3_native_conditions" data-target="s3_conditioned_prefix" data-from="s3_native_conditions" data-to="s3_conditioned_prefix" data-kind="flow" d="M330 710 L410 710" stroke="#517D61" marker-end="url(#stage3-arrow-flow)"/>
<path id="e_s3_prefix_kv" data-source="s3_conditioned_prefix" data-target="s3_prefix_attention" data-from="s3_conditioned_prefix" data-to="s3_prefix_attention" data-kind="flow" d="M690 710 L770 710" stroke="#517D61" marker-end="url(#stage3-arrow-flow)"/>
<path id="e_s3_kv_expert" data-source="s3_prefix_attention" data-target="s3_action_expert" data-from="s3_prefix_attention" data-to="s3_action_expert" data-kind="flow" d="M1040 710 L1120 710" stroke="#517D61" marker-end="url(#stage3-arrow-flow)"/>
<path id="e_s3_expert_actions" data-source="s3_action_expert" data-target="s3_native_actions" data-from="s3_action_expert" data-to="s3_native_actions" data-kind="flow" d="M1260 770 L1260 950" stroke="#517D61" marker-end="url(#stage3-arrow-flow)"/>
<path id="e_s3_velocity_loss" data-source="s3_action_expert" data-target="s3_flow_matching" data-from="s3_action_expert" data-to="s3_flow_matching" data-kind="supervision" d="M1180 770 L1180 850 L795 850 L795 950" stroke="#AF7437" marker-end="url(#stage3-arrow-supervision)"/>
<path id="e_s3_targets_loss" data-source="s3_native_targets" data-target="s3_flow_matching" data-from="s3_native_targets" data-to="s3_flow_matching" data-kind="supervision" d="M350 1010 L470 1010 L470 1040 L580 1040" stroke="#AF7437" marker-end="url(#stage3-arrow-supervision)"/>
</g>
