<g id="s2-horizons" data-annotation-id="s2-horizons"><rect x="40" y="140" width="1320" height="55" rx="7" fill="#F7F9FB" stroke="#D2DAE4" stroke-width="1"/>
<text x="700" y="176" text-anchor="middle" font-size="17" fill="#455368">在0.25秒／0.5秒／1.0秒三个尺度上查询，共用P的权重</text>
</g>
