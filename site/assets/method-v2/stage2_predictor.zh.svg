<text id="s2-predictor-body-1" class="node-body" x="470" y="351.5" text-anchor="middle">先k₁，后k₂</text>
</g>
<g id="s2-joint-distribution" data-node-id="s2-joint-distribution" data-node-type="predictor" aria-label="编码联合概率分布. p(k₁ | Iₜ, h) ×. p(k₂ | k₁, Iₜ, h)"><rect x="670" y="245" width="280" height="130" rx="8" fill="#F2EFF8" stroke="#79659B" stroke-width="1.5"/>
<text id="s2-joint-distribution-title-0" class="node-title" x="810" y="293.5" text-anchor="middle">编码联合概率分布</text>
