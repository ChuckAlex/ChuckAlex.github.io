<text x="795.0" y="1023.5" text-anchor="middle" font-size="17" font-weight="400">速度监督目标：ε − a</text>
<text x="795.0" y="1046.5" text-anchor="middle" font-size="17" font-weight="400">x_t = tε + (1 − t)a</text>
<text x="795.0" y="1069.5" text-anchor="middle" font-size="17" font-weight="400">训练时将带噪动作x_t与时刻t</text>
<text x="795.0" y="1092.5" text-anchor="middle" font-size="17" font-weight="400">作为原生动作expert的输入。</text>
