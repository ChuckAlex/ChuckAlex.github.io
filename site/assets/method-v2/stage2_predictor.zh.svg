<path id="s2-e04" data-from="s2-code-expectation" data-to="s2-continuous-prior" data-source="s2-code-expectation" data-target="s2-continuous-prior" data-edge-kind="predictor" d="M1190 375 L1190 505" fill="none" stroke="#70568F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-predictor)"/>
<path id="s2-e05" data-from="s2-frozen-teacher" data-to="s2-exported-labels" data-source="s2-frozen-teacher" data-target="s2-exported-labels" data-edge-kind="supervision" d="M270 575 L340 575" fill="none" stroke="#A87531" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-supervision)"/>
